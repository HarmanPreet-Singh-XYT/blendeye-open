name: Deploy BlendEye Open Agent Service to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'agent-service/**'
      - '.github/workflows/deploy-blendeye-open.yml'
  workflow_dispatch:
    inputs:
      region:
        description: 'Google Cloud Region (default: us-central1)'
        required: false
        default: 'us-central1'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ github.event.inputs.region || vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: blendeye-open-agent-service

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} to Cloud Run in region ${{ env.REGION }}..."

          # Construct comma-separated environment variables
          ENV_VARS="ENVIRONMENT=production"
          ENV_VARS="${ENV_VARS},GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}"
          ENV_VARS="${ENV_VARS},CLICKHOUSE_HOST=${{ secrets.CLICKHOUSE_HOST }}"
          ENV_VARS="${ENV_VARS},CLICKHOUSE_PORT=${{ secrets.CLICKHOUSE_PORT || '8443' }}"
          ENV_VARS="${ENV_VARS},CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER || 'default' }}"
          ENV_VARS="${ENV_VARS},CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}"
          ENV_VARS="${ENV_VARS},CLICKHOUSE_DATABASE=${{ secrets.CLICKHOUSE_DATABASE || 'default' }}"
          ENV_VARS="${ENV_VARS},CLICKHOUSE_SECURE=${{ secrets.CLICKHOUSE_SECURE || 'true' }}"
          # CORS. Browser traffic goes to the Next.js API routes on the same
          # origin, and Next.js -> agent-service is server-to-server, so this
          # never gates real app functionality — but the old '*' fallback left
          # the backend callable from any page on the web (audit C1).
          #
          # Keep this to ONE origin. `--set-env-vars` splits its argument on
          # commas, so a comma-separated or JSON-array value here would be
          # parsed as extra, malformed env vars. Override with the
          # ALLOWED_ORIGINS secret when testing from a preview domain.
          ENV_VARS="${ENV_VARS},ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || 'https://blendeye-open.vercel.app' }}"
          ENV_VARS="${ENV_VARS},GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"
          if [ -n "${{ secrets.PARALLEL_API_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},PARALLEL_API_KEY=${{ secrets.PARALLEL_API_KEY }}"
          fi

          if [ -n "${{ secrets.GOOGLE_CLOUD_PROJECT }}" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}"
          fi
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            ENV_VARS="${ENV_VARS},SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
          fi
          if [ -n "${{ secrets.SUPABASE_SECRET_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}"
          fi
          if [ -n "${{ secrets.GRAFANA_URL }}" ]; then
            ENV_VARS="${ENV_VARS},GRAFANA_URL=${{ secrets.GRAFANA_URL }}"
          else
            ENV_VARS="${ENV_VARS},GRAFANA_URL=https://fearlessimpatiens433.grafana.net"
          fi
          if [ -n "${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}" ]; then
            ENV_VARS="${ENV_VARS},GRAFANA_SERVICE_ACCOUNT_TOKEN=${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}"
          fi


          # Deploy using Cloud Run source deployment (builds Dockerfile via Cloud Build)
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./agent-service \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --timeout 900 \
            --memory 2Gi \
            --cpu 2 \
            --quiet \
            --set-env-vars "${ENV_VARS}"

          # Extract and output the live service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV
          echo "Service deployed successfully at: ${SERVICE_URL}"

      - name: Verify Service Health
        run: |
          echo "Testing health endpoint at ${SERVICE_URL}/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Health check passed (HTTP 200)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_STATUS (check Cloud Run logs)"
          fi

      - name: Deployment Summary
        run: |
          echo "### 🚀 Cloud Run Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name**: \`${{ env.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: [${{ env.SERVICE_URL }}](${{ env.SERVICE_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Docs (OpenAPI)**: [${{ env.SERVICE_URL }}/docs](${{ env.SERVICE_URL }}/docs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Metrics**: [${{ env.SERVICE_URL }}/observability/metrics](${{ env.SERVICE_URL }}/observability/metrics)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Next Step**: Add \`AGENT_SERVICE_URL=${{ env.SERVICE_URL }}\` to your Vercel Project Environment Variables." >> $GITHUB_STEP_SUMMARY
          echo "> **Grafana**: Add \`${{ env.SERVICE_URL }}/observability/metrics\` as a Metrics Endpoint scrape job in Grafana Cloud → Connections → Add new connection → Metrics Endpoint." >> $GITHUB_STEP_SUMMARY
